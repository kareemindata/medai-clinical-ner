<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" width="1120" height="420" role="img" aria-label="medai-clinical-ner architecture">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1120" height="420" fill="#ffffff"/>
  <text x="40" y="44" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Pipeline</text>
  <text x="40" y="68" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#64748b">Clinical note → tokenize → BERT-NER → span normalize → JSON entities</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <g transform="translate(40,120)">
      <rect width="200" height="120" rx="14" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
      <text x="14" y="28" font-size="12" fill="#8b5cf6" font-weight="700">01 · INPUT</text>
      <text x="14" y="60" font-size="16" fill="#0f172a" font-weight="600">Clinical note</text>
      <text x="14" y="84" font-size="12" fill="#475569">free-text, EN</text>
      <text x="14" y="102" font-size="12" fill="#475569">max 8k chars</text>
    </g>

    <g transform="translate(280,120)">
      <rect width="200" height="120" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
      <text x="14" y="28" font-size="12" fill="#3b82f6" font-weight="700">02 · TOKENIZE</text>
      <text x="14" y="60" font-size="16" fill="#0f172a" font-weight="600">WordPiece</text>
      <text x="14" y="84" font-size="12" fill="#475569">AutoTokenizer</text>
      <text x="14" y="102" font-size="12" fill="#475569">subword + offsets</text>
    </g>

    <g transform="translate(520,120)">
      <rect width="240" height="120" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
      <text x="14" y="28" font-size="12" fill="#10b981" font-weight="700">03 · BERT-NER</text>
      <text x="14" y="60" font-size="16" fill="#0f172a" font-weight="600">biomedical-ner-all</text>
      <text x="14" y="84" font-size="12" fill="#475569">token classification</text>
      <text x="14" y="102" font-size="12" fill="#475569">aggregation: simple</text>
    </g>

    <g transform="translate(800,120)">
      <rect width="180" height="120" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
      <text x="14" y="28" font-size="12" fill="#f59e0b" font-weight="700">04 · NORMALIZE</text>
      <text x="14" y="60" font-size="16" fill="#0f172a" font-weight="600">Span merge</text>
      <text x="14" y="84" font-size="12" fill="#475569">drop overlaps</text>
      <text x="14" y="102" font-size="12" fill="#475569">keep top-score</text>
    </g>

    <g transform="translate(220,280)">
      <rect width="680" height="100" rx="14" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
      <text x="20" y="32" font-size="12" fill="#ec4899" font-weight="700">05 · OUTPUT</text>
      <text x="20" y="62" font-size="16" fill="#0f172a" font-weight="600">[{ text, label, start, end, score } …]  →  CLI · FastAPI /extract · batch JSON</text>
      <text x="20" y="86" font-size="12" fill="#475569">Pluggable model via --model / MEDAI_NER_MODEL env var. LRU cache for hot inference.</text>
    </g>

    <g stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
      <line x1="240" y1="180" x2="280" y2="180"/>
      <line x1="480" y1="180" x2="520" y2="180"/>
      <line x1="760" y1="180" x2="800" y2="180"/>
      <path d="M890 240 C 890 268, 600 268, 560 280"/>
    </g>
  </g>
</svg>
